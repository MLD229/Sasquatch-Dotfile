# ── Couleurs (palette dynamique wallpaper) ────────
# === SASQUATCH-PALETTE-BEGIN ===
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(e0caccff)
    font_size = 72
    font_family = JetBrains Mono Bold
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A %d %B')"
    color = rgba(897678cc)
    font_size = 18
    font_family = JetBrains Mono
    position = 0, -110
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.2
    outer_color = rgba(bf616a44)
    inner_color = rgba(201012cc)
    font_color = rgba(e0caccff)
    fade_on_empty = true
    placeholder_text = <i>Mot de passe...</i>
    check_color = rgba(a6e3a1ff)
    fail_color = rgba(f38ba8ff)
    fail_text = <i>Raté ($ATTEMPTS)</i>
    rounding = 12
    position = 0, -180
    halign = center
    valign = center
}
# === SASQUATCH-PALETTE-END ===
