# Sasquatch Control Center — config cava (égaliseur synchronisé sur la musique)
# Entrée : FIFO audio système (/tmp/sasquatch-audio.fifo) alimentée par ffmpeg
# depuis le monitor PipeWire (voir cava.py). Capture TOUT le son qui sort
# (MPD, navigateur, lecteurs tiers) — pas seulement la FIFO MPD.
# Format : 44100:16:2 (ffmpeg -ar 44100 -ac 2).
[general]
bars = 20
framerate = 30
autosens = 1
overshoot = 20
sensitivity = 100
format = 44100:16:2

[input]
method = fifo
source = /tmp/sasquatch-audio.fifo

[output]
method = raw
raw_target = /tmp/sasquatch-cava.fifo
bit_format = 16bit
