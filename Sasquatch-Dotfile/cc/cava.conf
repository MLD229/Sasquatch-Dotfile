# Sasquatch Control Center — config cava (égaliseur synchronisé sur la sortie audio)
# Lancé par server.py ; lit la sortie audio (Pulse/PipeWire) → fifo raw 16-bit.
[general]
bars = 20
framerate = 30
autosens = 1
overshoot = 20
sensitivity = 100

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /tmp/sasquatch-cava.fifo
bit_format = 16bit
