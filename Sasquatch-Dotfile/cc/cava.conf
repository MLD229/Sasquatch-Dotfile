# Sasquatch Control Center — config cava (égaliseur synchronisé sur la musique)
# ⚠️ FICHIER DE RÉFÉRENCE : le conf RÉELLEMENT utilisé est généré au runtime
# par cc/cava.py (_write_cava_conf) dans XDG_RUNTIME_DIR avec les chemins
# PAR USER (pas de collision entre sessions). Ce fichier documente les réglages.
# Entrée : FIFO audio (par user) alimentée par ffmpeg depuis le monitor
# PipeWire (voir cava.py). Capture TOUT le son qui sort (MPD, navigateur,
# lecteurs tiers) — pas seulement la FIFO MPD.
# Format : 44100:16:2 (ffmpeg -ar 44100 -ac 2).
[general]
bars = 20
framerate = 30
autosens = 1
overshoot = 20
sensitivity = 100
format = 44100:16:2

[input]
method = fifo
source = <XDG_RUNTIME_DIR>/sasquatch-audio.fifo

[output]
method = raw
raw_target = <XDG_RUNTIME_DIR>/sasquatch-cava.fifo
bit_format = 16bit
