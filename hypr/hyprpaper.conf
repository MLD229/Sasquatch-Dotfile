# hyprpaper.conf
# Le wallpaper est appliqué par apply-wallpaper.sh (picker Super+Y, backend CC,
# login) via IPC hyprctl hyprpaper — rien à hardcoder ici. Le « souvenir » du
# wallpaper courant est ~/.config/waypaper/config.ini.
# Exemple manuel :
# preload = ~/Wall-E-Desk/Anime/example.png
# wallpaper = eDP-1,~/Wall-E-Desk/Anime/example.png

splash = false
ipc = on
