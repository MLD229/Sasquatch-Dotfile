# misc.conf
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    animate_manual_resizes = true
    enable_swallow = true
    swallow_regex = ^(kitty)$
    focus_on_activate = false
    # vfr supprimé — déplacé dans debug (défaut true en 0.56.2)
}

# ── Gestures trackpad ────────────────────────
gestures {
    # r±1 : cohérent avec SUPER+flèches (relatif, boucle 1↔10)
    workspace_swipe_use_r = true
    # swipe à DROITE = workspace précédent (r-1), à gauche = suivant (r+1)
    # (inversé — demande momo 2026-08-14)
    workspace_swipe_invert = true
    # permet de swiper même avec un seul workspace (en crée un nouveau)
    workspace_swipe_create_new = true
    # swipe continu à travers plusieurs workspaces
    workspace_swipe_forever = true
}
