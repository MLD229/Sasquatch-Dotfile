# env.conf — NVIDIA + Intel / Wayland

# ── Wayland core ─────────────────────────────
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland

# ── NVIDIA ───────────────────────────────────
# ⚠️ VA-API vidéo : NE PAS forcer NVIDIA (laptop hybride) — Discord/navigateurs
#    plantent ou pas de décodage vidéo. Laisser Intel gérer la vidéo (fix 2026-08-24).
#    Pour revenir en arrière : décommenter les 2 lignes ci-dessous puis relogin.
# env = LIBVA_DRIVER_NAME,nvidia
# env = NVD_BACKEND,direct          # hardware video decode (commenté : vidéo cassée)
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = __GL_GSYNC_ALLOWED,1
env = __GL_VRR_ALLOWED,1

# ── Curseur ──────────────────────────────────
env = XCURSOR_THEME,Bibata-Modern-Classic   # à adapter
env = XCURSOR_SIZE,24

# ── Qt / GTK Wayland ─────────────────────────
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11    # fallback x11 si besoin

# ── Firefox / Electron Wayland ───────────────
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# ── Java (fix fenêtres vides) ─────────────────
env = _JAVA_AWT_WM_NONREPARENTING,1

# ── GTK (thème Catppuccin Mocha, déplacé de hyprland.conf) ─
env = GTK_THEME,catppuccin-mocha-blue-standard+default
env = GTK_APPLICATION_PREFER_DARK_THEME,1

# ── IME japonais (fcitx5 + mozc) ──────────────
# Bascule : Ctrl+Shift+1 (Control+exclam, voir fcitx5/config)
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = SDL_IM_MODULE,fcitx
env = GLFW_IM_MODULE,ibus   # hack standard : Electron/GLFW cherchent "ibus" même avec fcitx5
