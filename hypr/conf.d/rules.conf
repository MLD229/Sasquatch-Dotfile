# rules.conf
# ── Float + Taille + Centre ───────────────────────────────
windowrule = match:class ^(pavucontrol)$,          float on, center on, size 800 600
windowrule = match:class ^(blueman-manager)$,      float on, center on, size 900 650
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:class ^(file-roller)$,          float on
windowrule = match:title ^(Picture-in-Picture)$,   float on
# ── Obsidian (vault Sasquatch-Files, Super+H) ──
# float = libre déplacement (pas de tiling), toggle via obsidian-toggle.sh.
# classe RÉELLE vérifiée 2026-08-20 : md.obsidian.Obsidian (fenêtre Wayland
# native via --ozone-platform=wayland) — PAS obsidian/electron43.
windowrule = match:class ^(md\.obsidian\.Obsidian)$, float on, center on, size 1000 700
# ── Opacité ──────────────────────────────────────────────
windowrule = match:class ^(kitty)$,   opacity 0.92 0.82 override
windowrule = match:class ^(firefox)$, opacity 1.0 1.0 override

# ── Control Center (Quickshell, Super+G) ────────────────
# fenêtre "Sasquatch CC" (cc/qml/main.qml) — overlay plein écran :
# dimensionnée par le QML (Screen.width/height), voile sombre intégré
windowrule = match:title ^(Sasquatch CC)$, float on
windowrule = match:title ^(Sasquatch CC)$, border_size 0
windowrule = match:title ^(Sasquatch CC)$, rounding 0
windowrule = match:title ^(Sasquatch CC)$, no_anim on
# NOTE 0.56.2 : l'effet `blur` n'existe plus dans la liste des windowrules
# (remplacé par `no_blur`) — le flou derrière une fenêtre translucide est
# AUTOMATIQUE quand decoration:blur:enabled=true (blur.conf). Ligne supprimée :
# `windowrule = match:title ^(Sasquatch CC)$, blur` → "invalid field blur: missing a value"
# (chaque élément de windowrule DOIT être "match:<prop> <regex>" ou "<effet> <valeur>")
# force la position (0,0) : sans ça, Hyprland centre dans la work area
# (42px réservés par waybar en haut) → fenêtre décalée à y=21, haut coupé
windowrule = match:title ^(Sasquatch CC)$, move 0 0

# ── Panneau Settings (Quickshell, Super+I) ──
# même traitement overlay que le CC : plein écran, voile intégré au QML
windowrule = match:title ^(Sasquatch Settings)$, float on
windowrule = match:title ^(Sasquatch Settings)$, border_size 0
windowrule = match:title ^(Sasquatch Settings)$, rounding 0
windowrule = match:title ^(Sasquatch Settings)$, no_anim on
windowrule = match:title ^(Sasquatch Settings)$, move 0 0

# ── Sélecteur de fonds d'écran (Quickshell, Super+Y) ──
# même traitement overlay que le CC : plein écran, voile intégré au QML,
# flou automatique derrière la translucidité (blur.conf) — pas de no_blur
windowrule = match:title ^(Sasquatch Wallpaper)$, float on
windowrule = match:title ^(Sasquatch Wallpaper)$, border_size 0
windowrule = match:title ^(Sasquatch Wallpaper)$, rounding 0
windowrule = match:title ^(Sasquatch Wallpaper)$, no_anim on
windowrule = match:title ^(Sasquatch Wallpaper)$, move 0 0
windowrule = match:title ^(Sasquatch Playlist)$, float on
windowrule = match:title ^(Sasquatch Playlist)$, border_size 0
windowrule = match:title ^(Sasquatch Playlist)$, rounding 0
windowrule = match:title ^(Sasquatch Playlist)$, no_anim on
# move : injecté par pl/pl.sh (position droite, `move 100%-N` bugué en 0.56)

# ── Sidebar 愛子 (Quickshell chat IA, Super+N) ──
# aiko v2 est un PanelWindow (layer-shell), PAS une fenêtre : plus aucune
# windowrule ne s'applique. Ancrage à gauche et taille (420 px) sont définis
# dans aiko/shell.qml (anchors.left + implicitWidth), donc rien à injecter ici.
# Le flou vient de BackgroundEffect (ext-background-effect-v1) demandé par le
# QML ; la layerrule ci-dessous est le repli (blur côté compositeur).
layerrule = match:namespace ^(aiko)$, blur on
# ── Lanceur rofi (Super seule) ──
# La fenêtre rofi est désormais translucide (bg-window α 0.62, colors.rasi) :
# sans flou derrière, le wallpaper/appli en dessous reste net et le texte des
# entrées perd du contraste (mesuré 4.0:1 sur fond clair). Le flou uniformise
# le fond derrière la surface → lisibilité conservée sans remonter l'alpha.
layerrule = match:namespace ^(rofi)$, blur on
# ── Sub page (scratchpad Hyprland, Super+S) ──
# Le cadre décoratif n'est PLUS une fenêtre : c'est une surface layer-shell
# (subpage/shell.qml, Quickshell, namespace « subpage », layer top). Elle ne
# vit pas dans un workspace → AUCUNE windowrule ici, et surtout pas de
# `workspace special:subpage` (c'était le piège : mapper la fenêtre pendant que
# le special est ouvert le fermait). Elle est en `top` parce qu'un layer
# background/bottom est invisible sous l'overlay du special workspace (mesuré).
# Aucune layerrule non plus : on ne veut AUCUN blur sur ce namespace (un blur
# sur une surface transparente plein écran = écran entier flou).
# « subpage » : ouvert/fermé par subpage.sh (togglespecialworkspace) ; les apps
# lancées pendant que la page est active s'y ouvrent (workspace actif).
# gapsout:16 garde les apps à distance des traits du cadre (dessinés à 10 px
# du bord + 3 px d'épaisseur) → le cadre ne recouvre jamais le contenu.
workspace = special:subpage, gapsout:16, gapsin:6
# ── Workspaces ───────────────────────────────────────────
windowrule = match:class ^(firefox)$, workspace 2
windowrule = match:class ^(discord)$, workspace 3
windowrule = match:class ^(spotify)$, workspace 4
# ── Fix NVIDIA tearing ───────────────────────────────────
windowrule = match:class ^(steam_app_.*)$, immediate on
# ── Workspaces persistants ──────────────────────────────
# persistent:true → les 10 workspaces existent toujours (boutons waybar
# visibles même vides). ⚠️ PAS de defaultName ici : waybar charge les noms
# des règles hyprland et les afficherait EN PLUS des noms renommés à chaud
# (doublon « 1..10 » + « いち..じゅう » en mode FR). Les noms sont gérés
# UNIQUEMENT par scripts/apply-lang.sh (lectures hiragana いち..じゅう en
# japonais, numéros 1..10 en français) — lancé au login (autostart.sh) et
# par le toggle du panneau (Super+I).
workspace = 1,  persistent:true
workspace = 2,  persistent:true
workspace = 3,  persistent:true
workspace = 4,  persistent:true
workspace = 5,  persistent:true
workspace = 6,  persistent:true
workspace = 7,  persistent:true
workspace = 8,  persistent:true
workspace = 9,  persistent:true
workspace = 10, persistent:true
