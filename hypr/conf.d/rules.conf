# rules.conf
# ── Float + Taille + Centre ───────────────────────────────
windowrule = match:class ^(pavucontrol)$,          float on, center on, size 800 600
windowrule = match:class ^(blueman-manager)$,      float on, center on, size 900 650
windowrule = match:class ^(waypaper)$,             float on, center on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:class ^(file-roller)$,          float on
windowrule = match:title ^(Picture-in-Picture)$,   float on
# ── Opacité ──────────────────────────────────────────────
windowrule = match:class ^(kitty)$,   opacity 0.92 override 0.82 override
windowrule = match:class ^(firefox)$, opacity 1.0 override 1.0 override

# ── Control Center (Quickshell, Super+G) ────────────────
# fenêtre "Sasquatch CC" (cc/qml/main.qml) — overlay plein écran :
# dimensionnée par le QML (Screen.width/height), voile sombre intégré
windowrule = match:title ^(Sasquatch CC)$, float on
windowrule = match:title ^(Sasquatch CC)$, border_size 0
windowrule = match:title ^(Sasquatch CC)$, rounding 0
windowrule = match:title ^(Sasquatch CC)$, no_anim on
# NOTE 0.56.2 : l'effet `blur` n'existe plus dans la liste des windowrules
# (remplacé par `no_blur`) — le flou derrière une fenêtre translucide est
# AUTOMATIQUE quand decoration:blur:enabled=true (blur.conf). Ligne supprimée :
# `windowrule = match:title ^(Sasquatch CC)$, blur` → "invalid field blur: missing a value"
# (chaque élément de windowrule DOIT être "match:<prop> <regex>" ou "<effet> <valeur>")
# force la position (0,0) : sans ça, Hyprland centre dans la work area
# (42px réservés par waybar en haut) → fenêtre décalée à y=21, haut coupé
windowrule = match:title ^(Sasquatch CC)$, move 0 0

# ── Panneau Settings (Quickshell, Super+I) ──
# même traitement overlay que le CC : plein écran, voile intégré au QML
windowrule = match:title ^(Sasquatch Settings)$, float on
windowrule = match:title ^(Sasquatch Settings)$, border_size 0
windowrule = match:title ^(Sasquatch Settings)$, rounding 0
windowrule = match:title ^(Sasquatch Settings)$, no_anim on
windowrule = match:title ^(Sasquatch Settings)$, move 0 0

# ── Sélecteur de fonds d'écran (Quickshell, Super+Y) ──
# même traitement overlay que le CC : plein écran, voile intégré au QML,
# flou automatique derrière la translucidité (blur.conf) — pas de no_blur
windowrule = match:title ^(Sasquatch Wallpaper)$, float on
windowrule = match:title ^(Sasquatch Wallpaper)$, border_size 0
windowrule = match:title ^(Sasquatch Wallpaper)$, rounding 0
windowrule = match:title ^(Sasquatch Wallpaper)$, no_anim on
windowrule = match:title ^(Sasquatch Wallpaper)$, move 0 0
windowrule = match:title ^(Sasquatch Playlist)$, float on
windowrule = match:title ^(Sasquatch Playlist)$, border_size 0
windowrule = match:title ^(Sasquatch Playlist)$, rounding 0
windowrule = match:title ^(Sasquatch Playlist)$, no_anim on
# move : injecté par pl/pl.sh (position droite, `move 100%-N` bugué en 0.56)

# ── Sidebar 愛子 (Quickshell chat IA, Super+N) ──
# Fenêtre = taille de la sidebar (420px, hauteur sous le waybar).
# ⚠️ move 100%-N ne marche PAS avec match:title (bug Hyprland 0.56) →
#    la position est injectée dynamiquement par aiko.sh (multi-résolution).
windowrule = match:title ^(Aiko)$, float on
windowrule = match:title ^(Aiko)$, border_size 0
windowrule = match:title ^(Aiko)$, rounding 0
windowrule = match:title ^(Aiko)$, no_anim on
# ── Workspaces ───────────────────────────────────────────
windowrule = match:class ^(firefox)$, workspace 2
windowrule = match:class ^(discord)$, workspace 3
windowrule = match:class ^(spotify)$, workspace 4
# ── Fix NVIDIA tearing ───────────────────────────────────
windowrule = match:class ^(steam_app_.*)$, immediate on
# ── Workspaces persistants (noms japonais : immersion) ──
# Lectures : いち に さん よん ご ろく なな はち きゅう じゅう
# ⚠️ `defaultName:` (pas `name:`) : syntaxe hyprlang pour donner un nom à un
# workspace numéroté — `name:` ne prend pas en 0.56 (réservé aux règles Lua).
workspace = 1,  defaultName:いち, persistent:true
workspace = 2,  defaultName:に, persistent:true
workspace = 3,  defaultName:さん, persistent:true
workspace = 4,  defaultName:よん, persistent:true
workspace = 5,  defaultName:ご, persistent:true
workspace = 6,  defaultName:ろく, persistent:true
workspace = 7,  defaultName:なな, persistent:true
workspace = 8,  defaultName:はち, persistent:true
workspace = 9,  defaultName:きゅう, persistent:true
workspace = 10, defaultName:じゅう, persistent:true
