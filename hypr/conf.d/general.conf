# general.conf
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    # === SASQUATCH-PALETTE-BEGIN ===
    col.active_border = rgba(460918ee) rgba(596371ee) 45deg
    col.inactive_border = rgba(444444aa)
# === SASQUATCH-PALETTE-END ===

    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

# ── misc : la sub page VIDE doit rester ouverte ──────────────────────────
# Le défaut Hyprland (1) referme un special workspace dès qu'il n'a plus de
# fenêtre : ouvrir la sub page vide faisait donc disparaître la page en < 1 s
# (mesuré : `hyprctl monitors -j` montrait special:subpage puis plus rien).
# La page est dessinée par la surface layer de subpage/shell.qml → elle doit
# pouvoir rester ouverte sans aucune fenêtre dedans.
# (catégorie misc rouverte : hyprlang fusionne avec hypr/conf.d/misc.conf)
misc {
    close_special_on_empty = false
}
