# keybinds.conf
$mod = SUPER

# ── Essentiels ───────────────────────────────
bind = $mod, t,    exec, kitty
bind = SUPER, b, exec, pkill blueman-manager || blueman-manager
bind = $mod, e,         exec, dolphin
bind = $mod, o,         exec, code            # VS Code (lecteur code/txt, mimeapps)
bindr = $mod, Y, exec, pkill waypaper || waypaper
bind = $mod, w,         exec, brave --load-extension=/home/momo/.config/cc/browser-bridge
bindr = SUPER, SUPER_L, exec, pkill rofi || ~/.config/rofi/scripts/launcher.sh
bind = $mod, L,         exec, hyprlock
# killactive sur Q (demande utilisateur — navigation gauche désormais libre)
bind = $mod, Q,         killactive
bind = $mod SHIFT, M,   exit

# Powermenu rofi
bind = $mod, Escape, exec, ~/.config/rofi/scripts/powermenu.sh

# ── Fenêtres ─────────────────────────────────
bind = $mod, F,         fullscreen
bind = $mod, V,         exec, ~/.config/scripts/clipboard.sh
bind = $mod SHIFT, V,   togglefloating
bind = $mod, P,         pseudo
bind = $mod, J,         layoutmsg, togglesplit

# ── Calculatrice (rofi + qalc, toggle) ───────
bind = $mod, C,         exec, ~/.config/scripts/calc.sh

# ── Focus (ZQSD azerty) ──────────────────────
bind = $mod, Z,         movefocus, u
bind = $mod, S,         movefocus, d
# Q = killactive (voir Essentiels) — movefocus l non bindé
# D = fenêtre PRIORITAIRE : maximize (remplit l'écran comme un fullscreen mais
# sans l'état fullscreen — pas de suppression des autres vues, la barre reste).
bind = $mod, D,         fullscreen, 0

# ── Move fenêtre ─────────────────────────────
bind = $mod SHIFT, Z,   movewindow, u
bind = $mod SHIFT, S,   movewindow, d
bind = $mod SHIFT, Q,   movewindow, l
bind = $mod SHIFT, D,   movewindow, r

# ── Workspaces ───────────────────────────────
bind = $mod, ampersand,  workspace, 1
bind = $mod, eacute,     workspace, 2
bind = $mod, quotedbl,   workspace, 3
bind = $mod, apostrophe, workspace, 4
bind = $mod, parenleft,  workspace, 5

bind = $mod SHIFT, ampersand,  movetoworkspace, 1
bind = $mod SHIFT, eacute,     movetoworkspace, 2
bind = $mod SHIFT, quotedbl,   movetoworkspace, 3
bind = $mod SHIFT, apostrophe, movetoworkspace, 4
bind = $mod SHIFT, parenleft,  movetoworkspace, 5

# Flèches — workspaces relatifs (azerty : touches Left/Right)
bind = $mod, Left,  workspace, r-1
bind = $mod, Right, workspace, r+1
bind = $mod SHIFT, Left,  movetoworkspace, r-1
bind = $mod SHIFT, Right, movetoworkspace, r+1

# ── Scroll workspaces ────────────────────────
# r±1 natif (boucle 1↔10). Direction INVERSÉE (demande momo 2026-08-14) :
# molette vers le bas = workspace suivant, vers le haut = précédent.
# Pour un vrai blocage 1..10 :
# bind = SUPER, mouse_down, exec, ~/.config/hypr/scripts/scroll-workspace.sh down
# bind = SUPER, mouse_up,   exec, ~/.config/hypr/scripts/scroll-workspace.sh up
bind = SUPER, mouse_down, workspace, r+1
bind = SUPER, mouse_up,   workspace, r-1

# ── Gestures trackpad ────────────────────────
# direction = horizontal : le signe du delta est conservé. Inversé via
# workspace_swipe_invert=true (misc.conf) → swipe gauche = suivant (r+1),
# swipe droite = précédent (r-1).
# (left/right normalisaient le signe → toujours en avant, bug upstream)
gesture = 3, horizontal, workspace
gesture = 4, horizontal, workspace
# ── Resize ───────────────────────────────────
binde = $mod CTRL, D, resizeactive,  30 0
binde = $mod CTRL, Q, resizeactive, -30 0
binde = $mod CTRL, Z, resizeactive,  0 -30
binde = $mod CTRL, S, resizeactive,  0  30

# ── Média / Son ──────────────────────────────
bindel = , XF86AudioRaiseVolume,  exec, ~/.config/scripts/volume.sh up
bindel = , XF86AudioLowerVolume,  exec, ~/.config/scripts/volume.sh down
bindl  = , XF86AudioMute,         exec, ~/.config/scripts/volume.sh mute
bindl  = , XF86AudioPlay,         exec, ~/.config/hypr/scripts/media-ctl.sh toggle
bindl  = , XF86AudioNext,         exec, ~/.config/hypr/scripts/media-ctl.sh next
bindl  = , XF86AudioPrev,         exec, ~/.config/hypr/scripts/media-ctl.sh prev

# ── Luminosité ───────────────────────────────
# bindel = auto-répétition ; ~/.config/scripts/brightness.sh + OSD rofi
bindel = , XF86MonBrightnessUp,   exec, ~/.config/scripts/brightness.sh up
bindel = , XF86MonBrightnessDown, exec, ~/.config/scripts/brightness.sh down

# ── Screenshot ───────────────────────────────
bind = ,      Print, exec, ~/.config/scripts/screenshot.sh full
bind = $mod,  Print, exec, ~/.config/scripts/screenshot.sh area

# ── Control Center (Quickshell, Super+G) ─────
bind = $mod, G, exec, ~/.config/cc/cc.sh

# ── Move/resize souris ───────────────────────
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ── Panneau Settings (Quickshell, Super+I) ───
bind = $mod, I, exec, ~/.config/settings/settings.sh

# ── Sidebar 愛子 (Quickshell chat IA, Super+N) ─
bind = $mod, N, exec, ~/.config/aiko/aiko.sh

# ── Overrides utilisateur ────────────────────
# Le panneau Settings écrit les keybinds modifiés dans keybinds-user.conf
# (dernier bind gagnant dans Hyprland). Fichier versionné, vide par défaut.
source = ~/.config/hypr/keybinds-user.conf
