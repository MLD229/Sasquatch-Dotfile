# ~/.config/mpd/mpd.conf — Sasquatch-Dotfile (version repo)
# Lecteur local + sortie FIFO pour le Control Center (Super+G)
#
# IMPORTANT : le CC (cc/) dépend d'UNE sortie fifo :
#   - ~/.local/share/mpd/cc.fifo → songrec (reconnaissance, cc/actions.py)
# Sans cette sortie, le finder ne capte rien quand MPD joue.
# (L'égaliseur cava N'utilise PAS de fifo MPD : il lit le monitor PipeWire
#  via ffmpeg → fifo par user dans XDG_RUNTIME_DIR, voir cc/cava.py.)

music_directory    "~/songs"
playlist_directory "~/.local/share/mpd/playlists"
db_file            "~/.local/share/mpd/tag_cache"
log_file           "~/.local/share/mpd/mpd.log"
pid_file           "~/.local/share/mpd/pid"
state_file         "~/.local/share/mpd/state"
sticker_file       "~/.local/share/mpd/sticker.sql"

# ── Socket unix PAR USER (pas de port TCP partagé) ───────────────
# Avant : bind 127.0.0.1:6600 → n'importe quel user local de la machine
# se connectait au MPD de momo et le CC affichait sa musique (« musique
# bloquée » chez les nouveaux users). Chaque user a SON socket ; mpc /
# ncmpc / le CC y pointent via MPD_HOST (fish/config.fish).
bind_to_address    "~/.local/share/mpd/socket"

# ── Sortie audio principale : PipeWire (via PulseAudio) ──
audio_output {
    type          "pulse"
    name          "PipeWire Pulse"
}

# ── Sortie FIFO dédiée au Control Center (reconnaissance songrec) ──
# Lecture SOLO par le CC (cc/actions.py) quand MPD joue réellement.
# Pour toute autre source (navigateur...), le finder capture le monitor
# PipeWire directement. Mono 44.1k = idéal pour le fingerprint.
audio_output {
    type          "fifo"
    name          "CC Capture"
    path          "~/.local/share/mpd/cc.fifo"
    format        "44100:16:1"
}

mixer_type      "software"

filesystem_charset "UTF-8"

# Auto-update de la base quand des fichiers changent
auto_update    "yes"

# Ne PAS reprendre la lecture au démarrage
restore_paused  "yes"

# Réglages réseau MCP/API-friendly
connection_timeout  "5"
max_connections     "20"
